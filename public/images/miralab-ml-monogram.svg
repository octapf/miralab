<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
  <!-- Monograma ML: cuadrado blanco inset + dos cortes diagonales paralelos (fondo) -->
  <rect width="100" height="100" fill="#00051a" />
  <rect x="5" y="5" width="90" height="90" fill="#ffffff" />
  <!-- Corte principal (más ancho): ~65% arriba → ~50% abajo -->
  <path fill="#00051a" d="M 63.5 5 L 71.5 5 L 58 95 L 50 95 Z" />
  <!-- Corte secundario (más fino), paralelo al primero -->
  <path fill="#00051a" d="M 73.5 5 L 77.5 5 L 64 95 L 60 95 Z" />
</svg>
